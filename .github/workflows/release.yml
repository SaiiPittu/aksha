# Release: build, check and smoke-test the distributions, then publish them to TestPyPI and
# then PyPI through trusted publishing (OpenID Connect; no API token is stored anywhere).
#
# It runs ONLY when a version tag vX.Y.Z is pushed: no branch trigger and no manual trigger,
# so nothing is published from a normal push or from the Actions tab. It cannot publish
# until the maintainer has done the one-time setup in docs/releasing.md (a LICENSE, pending
# publishers on PyPI and TestPyPI, and the testpypi and pypi environments, with a required
# reviewer on pypi). Pushing the tag and approving the pypi job are the maintainer's.
#
# Third-party actions are pinned to full commit SHAs (the version is in the comment), as in
# ci.yml. Each SHA was checked against its release tag on 26 Nov 2026.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build, check and smoke-test
    # A fork's tag never publishes.
    if: github.repository == 'SaiiPittu/aksha'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: A license is chosen
        run: |
          test -f LICENSE || { echo "::error::no LICENSE file (docs/releasing.md, step 1)"; exit 1; }
          grep -q '^license = ' pyproject.toml || { echo "::error::no license in pyproject.toml"; exit 1; }
      - run: make venv PY=3.12
      - name: Build and check the metadata
        run: make dist
      - name: The built version is the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "tag $TAG, built $version"
          test "v$version" = "$TAG"
      - name: Install the wheel in a fresh environment and run aksha there
        run: AKSHA_DIST=dist .venv/bin/pytest -p no:cacheprovider tests/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aksha-harness
    permissions:
      id-token: write # trusted publishing; only the two publish jobs get it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi # the maintainer is its required reviewer: this job waits for approval
      url: https://pypi.org/p/aksha-harness
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
