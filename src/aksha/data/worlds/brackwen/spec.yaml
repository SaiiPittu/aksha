# SYNTHETIC. Author-side spec for a synthetic test world; not read by any tool.
world: brackwen
synthetic: true
notice: Author-side truth for a synthetic patent-only world in warehouse robotics, written to check that the patent agent carries nothing from the worlds it was built on. It was authored from the world format alone, without reading any agent module or offline model. No tool reads this file.
frozen_today: '2026-11-26'
date_convention: ISO 8601 in data; prose dates in several styles on purpose (19 February 2026, 14 Apr 2026, and a US-style 01/27/2026 in one memo)
identifier_schemes:
  publication: SYN-PUB-03\d{2}
  priority: SYN-PRI-YYYY-MMDD
  idea: BRK-1\d{2}
  event: SYN-EV-3\d
  office: SYN-Office-\d
layout_note: Patent inputs only, no research inputs. Folders (design/, team/, ops/, media/, mail/, strategy/, counsel/, prior-art-search/) and shapes differ from every other world. The four candidates arrive as four different shapes (a Markdown design note with E-numbered steps, a plain-text memo with G-numbered steps, an issue-tracker JSON export, a whiteboard transcription). Contributors are YAML with no person IDs; disclosures are a JSON register with a null date; priorities are a Markdown table of P0 to P3 levels whose rows are not in rank order; two publications of one family sit in one search-report file; the others are JSON with yet another key set, PDF-like text and an HTML page.
venture:
  name: Brackwen Robotics
  domain: brackwen.example
  product: Pickwen picking cell
  summary: A piece-picking robot cell for warehouses that empties totes of mixed items, with a two-finger gripper on a lockable compliant wrist, a suction-cup fallback and a heuristic grasp planner on a depth camera.
people:
- {name: Dana Velasquez, employer: Brackwen Robotics, role: founder and CEO}
- {name: Ravi Anand, employer: Brackwen Robotics, role: mechanical lead}
- {name: Lena Brandt, employer: Brackwen Robotics, role: controls engineer}
- {name: Oskar Lindqvist, employer: Brackwen Robotics, role: perception engineer}
- {name: Ines Valcourt, employer: Lintmoor Mechatronics, role: outside contractor, agreement: 'SYN-CSA-2026-02, effective 2026-02-16, document not in the world'}
candidates:
  BRK-101:
    name: lockable compliant wrist
    source: design/brk-101-lockable-wrist.md
    conceived: '2026-02-19'
    status: built; 3,000 bench picks
    elements: {E1: compliant elastomer flexure on approach, E2: lock by electro-permanent-magnet clutch after contact force stays above 4 N for 80 ms, E3: breakaway release above 1.2 N·m wrist torque and arm stop, E4: re-zero the force-torque sensor after each release}
    deliberate_gap: why 4 N is the lock threshold is in no source
    outside_party: Ines Valcourt proposed E3 on 2026-02-03, before the note and before her agreement's effective date; the credits file lists her only for the test jig
  BRK-102:
    name: heuristic grasp ranking on a depth image
    source: design/grasp-ranking-memo.txt
    conceived: '2026-01-27'
    status: running on both cells
    elements: {G1: fingertip patch flatness, G2: distance to the estimated centre of mass, G3: finger clearance sweep of 8 mm, G4: suction fallback below a 0.35 score}
    public: the venture's own video description (2026-04-14) gives G1 to G4 in full under the product name, never the idea ID
  BRK-103:
    name: acoustic slip detection in the finger pad
    source: design/tracker-export-slip.json
    conceived: '2026-05-02'
    status: prototype on one finger set
    elements: {A1: contact microphone under the pad, A2: slip when 2 to 6 kHz band energy exceeds 3x baseline for 5 ms, A3: grip force up 15 percent per slip to a 40 N ceiling}
  BRK-104:
    name: tote-wall sweep map with approach tilt
    source: design/whiteboard-2026-08-11.md
    conceived: '2026-08-11'
    status: whiteboard only
    elements: {W1: tote rim from depth edges, W2: finger sweep map along the approach path, W3: tilt the approach up to 15 degrees, three tries}
    deliberate_gap: tote-geometry-survey.ods is referenced but not in the world
families:
  A: {priority: SYN-PRI-2021-1104, members: [SYN-PUB-0301, SYN-PUB-0302], file: prior-art-search/search-report-2026-10.md, note: both members in one search report; the grant narrows to a fixed 150 ms delay; E2 only partial}
  B: {priority: SYN-PRI-2022-0517, members: [SYN-PUB-0303, SYN-PUB-0304], note: SYN-PUB-0304 status line says In force while its legal events say Revoked after opposition}
  C: {priority: SYN-PRI-2020-0929, members: [SYN-PUB-0305], note: discloses all of BRK-103}
  D: {priority: SYN-PRI-2023-0212, members: [SYN-PUB-0306], note: discloses W1 only}
disclosures:
  SYN-EV-31: {date: '2026-04-14', idea: BRK-102, kind: own public video description, public: true}
  SYN-EV-32: {date: '2026-02-03', idea: BRK-101, kind: contractor email, public: false}
  SYN-EV-33: {date: null, idea: BRK-101, kind: site visit by an integrator, public: unclear}
  SYN-EV-34: {date: '2026-06-09', idea: BRK-101, kind: investor demo under NDA, public: false}
priorities: {BRK-101: 1, BRK-102: 2, BRK-104: 3, BRK-103: 4}
traps:
- T-GRACE - the venture's own public video description discloses BRK-102 in full, under a product name and without the idea ID
- T-CONSULT - a contractor's email chain proposes E3 before the design note and before her agreement starts; the credits file understates her
- T-PARTIAL - family A discloses only part of BRK-101 (E1 yes, E2 in part, E3 and E4 no), and its two members differ
- T-MISSING - BRK-104 relies on a survey that is not in the world
- T-STATUS - SYN-PUB-0304 says In force in one field and Revoked after opposition in its legal events
- T-GAP - the BRK-101 lock threshold has no recorded rationale
- T-UNDATED - an undated site visit with unclear public status
- T-RANKORDER - the priorities table lists P2, P0, P3, P1 in that row order
