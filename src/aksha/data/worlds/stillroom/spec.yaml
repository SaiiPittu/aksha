candidates:
  C1:
    name: self-calibration
    note: notes/C1-self-calibration.md
    conceived: '2026-01-14'
    status: built and bench tested
    mechanism_steps:
    - Treat the room as verified empty only when the PIR has seen no motion for 20 minutes and the door contact reports closed
    - Record each pixel's mean and standard deviation during the window
    - Update the baseline as an exponential moving average with weight 0.01 per minute
    - Freeze learning in pixels with a detection in the last 10 minutes
    - Per-pixel threshold = baseline + 4 x standard deviation
    features:
      F1: per-pixel thermopile empty-room baseline
      F2: baseline update only after a PIR quiet window
      F3: baseline update also gated on the door contact reporting closed
      F4: slow EMA update with per-pixel freeze after detection
      F5: per-pixel threshold from that pixel's noise
    deliberate_gap: rationale for the 20 minute window is not in any source
  C2:
    name: sensor placement
    note: notes/C2-sensor-placement.md
    conceived: '2026-02-03'
    status: whiteboard only
    features:
      P1: footprint at seated head height from field of view
      P2: layout score over seat coverage, overlap, heat-source and doorway exposure
      P3: post-install walk test against the plan
    deliberate_gap: placement-trial-02.csv is referenced but not in the world; minimum vent distance not decided
  C3:
    name: privacy-preserving coordination
    note: notes/C3-privacy-preserving-coordination.md
    conceived: '2026-02-20'
    status: running in a pilot under NDA
    features:
      Q1: on-device processing, counts only
      Q2: overlap zone marked in each unit's pixel coordinates at install
      Q3: each unit reports total and overlap counts
      Q4: room = A + B - min(overlap_A, overlap_B)
      Q5: single-occupant rooms grouped in roll-ups
  C4:
    name: battery-saving sampling
    note: notes/C4-battery-saving-sampling.md
    conceived: '2026-01-28'
    status: prototype, power not measured
    features:
      B1: PIR wakes the thermopile for a 60 s window at 1 Hz
      B2: fall back to 10 s sampling then PIR-only
      B3: report on change plus 15 min heartbeat
      B4: estimated 0.2 mA average (estimate, not measured)
