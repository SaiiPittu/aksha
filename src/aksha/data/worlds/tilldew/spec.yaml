  person: SYN-P-\d{2}
  review: SYN-RV-\d{2}
  event: SYN-EV-\d{2}
  office: SYN-Office-\d
layout_note: Folder and file names differ from stillroom on purpose (vendors/, exports/, rnd/, people/, log/, mail/, forms/, prior-art/), and so do column names, section headings and template field names. The agents find every input by its content.
