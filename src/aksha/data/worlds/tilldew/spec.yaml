- {id: SYN-P-04, name: Arjun Pillai, employer: Tilldew, role: hardware engineer}
- {id: SYN-P-05, name: Farah Qadir, employer: Tilldew, role: founder}
candidates:
  TD-1:
    name: salinity-compensated moisture reading
    note: rnd/td1-salinity-compensated-moisture.md
    conceived: '2026-01-19'
    status: bench and field tested
    elements: {S1: two-frequency capacitance, S2: salinity from the ratio, S3: lookup-table correction per soil type, S4: two-reading confirmation before an alert}
    deliberate_gap: why two confirming readings and not three is not in any source
  TD-2:
    name: irrigation timing from evapotranspiration and the tariff
    note: rnd/td2-tariff-aware-irrigation.md
    conceived: '2026-03-04'
    status: whiteboard only
    elements: {S1: evapotranspiration forecast, S2: cheapest tariff window, S3: cancel on forecast rain}
    deliberate_gap: tariff-analysis.xlsx is referenced but not in the world; the tariff table source is not decided
  TD-3:
    name: electrode self-cleaning by polarity reversal
    note: rnd/td3-electrode-self-cleaning.md
    conceived: '2026-02-10'
    status: prototype
    elements: {S1: timed polarity reversal pulse, S2: before-and-after comparison for scale, S3: cleaning alert after three cycles}
