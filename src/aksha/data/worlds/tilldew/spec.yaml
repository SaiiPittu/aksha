# SYNTHETIC. Author-side spec for a synthetic test world; not read by any tool.
world: tilldew
synthetic: true
notice: Author-side truth for a synthetic world in a different domain from stillroom, written to prove the agents are general. No tool reads this file, and no agent module names anything in it.
