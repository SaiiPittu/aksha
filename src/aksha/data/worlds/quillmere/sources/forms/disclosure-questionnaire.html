<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="synthetic" content="true">
<title>Invention disclosure questionnaire (synthetic)</title>
</head>
<body>
<p>SYNTHETIC FIXTURE. A counsel's questionnaire invented for testing.</p>
<h1>Invention disclosure questionnaire</h1>
<p>Please answer each question. Leave a question blank if you do not know; do not guess.</p>
<form>
  <label for="q1">1. Short title of the invention</label> <input id="q1" name="title" required>
  <label for="q2">2. What problem does it solve?</label> <textarea id="q2" name="problem" required></textarea>
  <label for="q3">3. How does it work, step by step, with numbers and units?</label> <textarea id="q3" name="how_it_works" required></textarea>
  <label for="q4">4. What did you try instead, and why was it dropped?</label> <textarea id="q4" name="alternatives"></textarea>
  <label for="q5">5. When was it first written down, and where?</label> <input id="q5" name="first_record" required>
  <label for="q6">6. Who contributed, with their employer and terms?</label> <textarea id="q6" name="contributors" required></textarea>
  <label for="q7">7. Every time it was shown, published or sold outside the company, with dates</label> <textarea id="q7" name="disclosures" required></textarea>
  <label for="q8">8. Closest earlier publications you know of</label> <textarea id="q8" name="known_art"></textarea>
  <fieldset disabled>
    <legend>For counsel only</legend>
    <label for="c1">Inventorship determination</label> <input id="c1" name="inventorship">
    <label for="c2">Ownership and agreements</label> <input id="c2" name="ownership">
  </fieldset>
</form>
<footer>SYNTHETIC FIXTURE - invented for testing.</footer>
</body>
</html>
