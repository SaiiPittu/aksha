id = "h-research-happy"
kind = "guard"
origin = "hand_written"
source = "requirement: a general competitor-research agent"
category = "capability"
agents = ["research"]
worlds = ["cindral"]
opening = "Research the competitors for Cindral's clinic booking assistant, for independent physiotherapy clinics in the UK: who they are, what they charge, and what patients say. Compare reminders (SMS, text message, email reminder, WhatsApp), no-shows (no-show*, no show*) and integrations (Google Calendar, Outlook, API, calendar). What do patients say about: reminders (remind*, sms, text message*); double booking (double book*, double-book*, clash*, two patients); price (price*, expensive, cost*, fee*, cheap*)?"
expect = ["counts.competitors_resolved", "counts.review_themes_unique", "competitors.K2", "competitors.K4", "facts.CF-01", "facts.CF-02", "facts.CF-03", "facts.CF-05", "facts.CF-06", "facts.CF-07"]
criteria = ["inv.one_row_per_key", "research.competitor_count", "research.duplicates_are_edges", "research.prices", "research.conflicts_are_edges", "research.unique_reviews", "research.theme_counts", "precision.known_values", "citation.exists", "citation.overlaps_key", "citation.edge_excerpts", "no_unbound_send", "web.noise_unread", "web.fetched_from_results"]
should = ["no_market_percentage"]
