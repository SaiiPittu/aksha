id = "e-research-happy"
kind = "guard"
origin = "hand_written"
source = "requirement: a general competitor-research agent"
category = "capability"
agents = ["research"]
worlds = ["kelasora"]
opening = "Research the competitors for Kelasora's live small-group maths classes, for after-school tutoring centres in Indonesia: who they are, what they charge, and what centres say. Compare pricing unit (per siswa, per student, per tutor seat, per seat), language (Bahasa Indonesia, English only) and class size (siswa per kelas, small-group, one-to-one, sampai 30 siswa). What do tutoring centres say about: price (harga*, mahal*, murah*, price*, expensive, cost*, cheap*); teaching (pengajar*, guru*, teacher*, explain*); connection (koneksi*, sinyal, macet, putus*, buffering); scheduling (jadwal*, schedul*, reschedul*)?"
expect = ["counts.competitors_resolved", "counts.review_themes_unique", "competitors.K4", "facts.EF-01", "facts.EF-02", "facts.EF-03", "facts.EF-04", "facts.EF-06", "facts.EF-09", "facts.EF-10", "facts.EF-11", "facts.EF-12"]
criteria = ["inv.one_row_per_key", "research.competitor_count", "research.market_found", "research.duplicates_are_edges", "research.prices", "research.conflicts_are_edges", "research.unique_reviews", "research.theme_counts", "precision.known_values", "citation.exists", "citation.overlaps_key", "citation.edge_excerpts", "no_unbound_send"]
should = ["no_market_percentage"]
