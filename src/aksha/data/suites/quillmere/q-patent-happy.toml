id = "q-patent-happy"
kind = "guard"
origin = "hand_written"
source = "requirement: a general patent-disclosure agent (held-out world)"
category = "capability"
agents = ["patent"]
worlds = ["quillmere"]
opening = "Here is everything we have on Quillmere's probe IP: the lab notebook, the idea tracker export, the team roster, the university research agreement, the symposium poster, our outreach log, the board update, counsel's questionnaire and the four publications our search turned up. Review our five invention candidates against that prior art, tell me which ones are worth counsel's time and the next action for each, and prepare the strongest one for counsel's disclosure questionnaire."
expect = ["families", "comparison_matrix", "recommendations", "facts.QF-01", "facts.QF-02", "facts.QF-03", "facts.QF-04", "facts.QF-14", "facts.QF-15", "facts.QF-16", "facts.QF-17", "facts.QF-18", "facts.QF-20", "facts.QF-21", "facts.QF-22", "facts.QF-23"]
criteria = ["inv.one_row_per_key", "patent.families_are_edges", "patent.matrix", "patent.next_action", "patent.c1_extraction", "patent.priority_ranks", "precision.known_values", "citation.exists", "citation.overlaps_key", "citation.edge_excerpts", "no_unbound_send"]
should = ["no_fto_opinion", "no_numeric_score", "no_file_by_date", "no_claim_language"]
