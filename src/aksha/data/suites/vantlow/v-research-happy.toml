id = "v-research-happy"
kind = "guard"
origin = "hand_written"
source = "requirement: a general competitor-research agent"
category = "capability"
agents = ["research"]
worlds = ["vantlow"]
opening = "We are picking a hosted log-management product for Vantlow's platform team. Research the products for seed-stage developer-tools startups in North America: who sells them, what they charge (by GB ingested, with tiers and free quotas), and what engineers say on the forums. Compare query speed (query speed, latency, fast*, slow*), retention (retention, retain*, days of logs) and alerting (alert*, webhook, on-call). What do engineers say about: ingest cost (price*, cost*, bill*, expensive, cheap*, overage*); query speed (slow*, fast*, latency, query speed); retention (retention, retain*, days of logs)?"
expect = ["counts.competitors_resolved", "counts.review_themes_unique", "competitors.K2", "competitors.K3", "facts.VF-01", "facts.VF-02", "facts.VF-03", "facts.VF-04", "facts.VF-05", "facts.VF-06", "facts.VF-07"]
criteria = ["inv.one_row_per_key", "research.competitor_count", "research.duplicates_are_edges", "research.prices", "research.conflicts_are_edges", "research.unique_reviews", "research.theme_counts", "precision.known_values", "citation.exists", "citation.overlaps_key", "citation.edge_excerpts", "no_unbound_send"]
should = ["no_market_percentage"]
