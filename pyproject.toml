[build-system]
# setuptools 77 reads the SPDX license string (PEP 639); setuptools-scm takes the version
# from the git tag vX.Y.Z, so a tag and the built version cannot disagree.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name: "aksha" on the package index is an unrelated project. The import
# name and the command stay `aksha`.
name = "aksha-harness"
dynamic = ["version"]
description = "A headless agent harness that thinks fast and slow: an event-sourced runtime with durable pauses, a policy gate and crash-safe effects."
readme = "README.md"
requires-python = ">=3.12"
# license = "<SPDX id>" and license-files = ["LICENSE"] go here once the maintainer picks a
# license (docs/releasing.md); the release workflow refuses to build without them.
keywords = ["agents", "agent-harness", "llm", "event-sourcing", "durable-execution", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The runtime package uses the standard library plus jsonschema, nothing else.
dependencies = ["jsonschema>=4.19"]

[project.optional-dependencies]
# Storage adapters are optional extras; the runtime core never imports them.
# `make venv` installs the dev group only; `make venv-postgres` adds the PostgreSQL driver.
postgres = ["psycopg[binary]>=3.2"]
# The HTTP server of the session API (ADR-P19): ``aksha serve``.
server = ["fastapi>=0.115", "uvicorn>=0.30"]
# The trace exporter extension (ADR-P21 D8): OTLP JSON Lines files, offline.
otel = ["opentelemetry-sdk~=1.45.2", "opentelemetry-exporter-otlp-json-file==0.66b2"]
# The ingest extension's parsers: PDF (BSD-3-Clause), Word, PowerPoint and Excel (MIT),
# images (MIT-CMU). Without them those types are named gaps; text, CSV, JSON, HTML and
# email need only the standard library. HEIC needs pillow-heif, installed separately:
# its binary wheels are GPL-2.0 (they bundle an x265 encoder), so no extra here names it.
ingest = [
    "pypdf>=7.1.1,<8",
    "python-docx>=1.2.0,<2",
    "python-pptx>=1.0.2,<2",
    "openpyxl>=3.1.5,<4",
    "pillow>=13.0.0,<14",
]

[dependency-groups]
# Development tools (PEP 735): never an extra a user of the package sees.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "httpx2",  # the test client of starlette, under FastAPI
]

[project.urls]
Homepage = "https://github.com/SaiiPittu/aksha"
Documentation = "https://github.com/SaiiPittu/aksha/tree/main/docs"
Repository = "https://github.com/SaiiPittu/aksha"
Issues = "https://github.com/SaiiPittu/aksha/issues"

[project.scripts]
aksha = "aksha.interfaces.cli.main:entry"

[tool.setuptools.packages.find]
# src layout (Python Packaging User Guide): the package lives at ./src/aksha, so tests
# import the installed package, never the working tree by accident. Only it is packaged;
# web/ and scratch-pad/ never are.
where = ["src"]
include = ["aksha*"]

[tool.setuptools.package-data]
# Listed explicitly so the wheel never depends on what git tracks: the agents' prompts and
# the bundled synthetic worlds and eval suites (aksha.data), which `aksha demo` and
# `aksha eval` read from the installed package.
aksha = [
    "py.typed",
    "agents/**/*.md",
    "agents/**/*.json",
    "data/README.md",
    "data/worlds/**/*",
    "data/suites/**/*",
    "data/recordings/**/*",
]

[tool.setuptools_scm]
# No version file: aksha.__version__ reads the installed metadata (importlib.metadata).
# With no tag yet, builds are 0.1.devN+g<sha>: a local version the package index refuses,
# so only a vX.Y.Z tag builds an uploadable one. Building needs the git history (CI checks
# out with fetch-depth: 0) or an sdist, which carries its version.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." makes the tests package importable; aksha itself comes from the editable install.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", ".", "tests"]
extend-exclude = ["scratch-pad", "web"]

[tool.ruff.format]
# ruff 0.17+ also formats Python code blocks inside Markdown. The design docs hold sketches
# (signatures with aligned comments, elided bodies), not code to reformat.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "D",       # docstrings: every public module, class and function is documented
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; docstrings are optional there.
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src/aksha", "tests"]
exclude = ["^scratch-pad/", "^web/"]

[[tool.mypy.overrides]]
# The ingest extension's parsers are an optional extra; some ship no type information.
module = ["pypdf", "pypdf.*", "docx", "docx.*", "pptx", "pptx.*", "openpyxl", "openpyxl.*",
          "PIL", "PIL.*", "pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The PostgreSQL driver is an optional extra. Without it installed, its types are Any; with
# it installed (pip install 'aksha-harness[postgres]'), mypy checks the adapter against them.
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true
